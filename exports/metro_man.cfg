! ===============================================
! NetArchitect Auto-Generated Config: metro_man
! Physical Layer: OS2 Single-Mode Fiber (9/125 um) (10GBASE-LR / 10GBASE-ER)
! Protocol: Single-Area OSPF with Dual-Homed BFD Failover
! ===============================================
enable
configure terminal
hostname metro_man
no ip domain-lookup
spanning-tree mode rapid-pvst
!
vlan 10
 name FinTech_Colo_Traders
interface Vlan10
 description Gateway for FinTech_Colo_Traders
 ip address 172.16.0.1 255.255.255.0
 no shutdown
!
vlan 20
 name HO_Operations
interface Vlan20
 description Gateway for HO_Operations
 ip address 172.16.1.1 255.255.255.128
 no shutdown
!
vlan 30
 name Remote_Branch_Staff
interface Vlan30
 description Gateway for Remote_Branch_Staff
 ip address 172.16.1.129 255.255.255.128
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 172.16.0.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.127 area 0
 network 172.16.1.128 0.0.0.127 area 0
exit
!
interface GigabitEthernet0/1
 description Backbone Trunk Link
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-100
 switchport nonegotiate
 no shutdown
!
end
write memory
