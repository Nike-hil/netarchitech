! ===============================================
! NetArchitect Auto-Generated Config: global_wan
! Physical Layer: OS2 Single-Mode Fiber (9/125 um) (10GBASE-LR / 10GBASE-ER)
! Protocol: eBGP + Multi-Area OSPF
! ===============================================
enable
configure terminal
hostname global_wan
no ip domain-lookup
spanning-tree mode rapid-pvst
!
vlan 10
 name Warehouse_Scanners_City1
interface Vlan10
 description Gateway for Warehouse_Scanners_City1
 ip address 10.200.0.1 255.255.252.0
 no shutdown
!
vlan 20
 name IoT_Fleet_City2
interface Vlan20
 description Gateway for IoT_Fleet_City2
 ip address 10.200.4.1 255.255.252.0
 no shutdown
!
vlan 30
 name Logistics_City3
interface Vlan30
 description Gateway for Logistics_City3
 ip address 10.200.8.1 255.255.254.0
 no shutdown
!
vlan 40
 name Distribution_City4
interface Vlan40
 description Gateway for Distribution_City4
 ip address 10.200.10.1 255.255.254.0
 no shutdown
!
vlan 50
 name Cloud_VPC_Services
interface Vlan50
 description Gateway for Cloud_VPC_Services
 ip address 10.200.12.1 255.255.255.128
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 10.200.0.0 0.0.3.255 area 0
 network 10.200.4.0 0.0.3.255 area 0
 network 10.200.8.0 0.0.1.255 area 0
 network 10.200.10.0 0.0.1.255 area 0
 network 10.200.12.0 0.0.0.127 area 0
exit
!
interface GigabitEthernet0/1
 description Backbone Trunk Link
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10-100
 switchport nonegotiate
 no shutdown
!
end
write memory
